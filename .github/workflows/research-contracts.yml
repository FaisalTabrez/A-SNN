name: Research contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-research.txt
      - name: Unit contracts and audit regressions
        run: python -m unittest discover -s gen5/tests -v
      - name: Execute offline synthetic notebook
        run: python gen5/tools/verify_research_notebook.py --work-dir tmp/ci_notebook_smoke
      - name: Package smoke
        run: |
          python -m pip install setuptools==80.9.0 wheel
          python -m pip install --no-deps --no-build-isolation -e .
          asnn-evidence1 --help
      - name: Verify released source coverage
        run: python gen5/tools/verify_research_release.py --require-tracked
      - name: Verify canonical graph receipt
        run: python gen5/tools/verify_graphify_contract.py --require-research --require-corpus
